name: Auto Version

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

env:
  CURRENT_BRANCH: ${{github.event.pull_request.head.ref}}
  VERSION_FORMAT: ${{ fromJSON('[ "*.^.0", "*.*.^"]')[contains(github.event.pull_request.labels.*.name, 'minor')] }}

jobs:
  update:
    if: contains(github.event.pull_request.labels.*.name, 'minor') || contains(github.event.pull_request.labels.*.name, 'major')
    runs-on: windows-latest
    name: Update version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: 
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Update version
        id: update
        uses: vers-one/dotnet-project-version-updater@v1.7
        with:
          file: ./src/ACadSharp/ACadSharp.csproj
          version: ${{env.VERSION_FORMAT}}
      - name: Push changes
        run: bash push-changes.sh
        shell: bash
        env:
          BRANCH: ${{github.head_ref || github.ref_name}}
          VERSION: ${{steps.update.outputs.newVersion}}          
          HEAD_REPO: ${{github.event.pull_request.head.repo.full_name}}
          PUSH_TOKEN: ${{secrets.PUSH_TOKEN}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        env:
          GIT_USER: ${{ github.event.pull_request.merged_by.login }}
          GIT_USER_ID: ${{ github.event.pull_request.merged_by.id }}
        run: |
          git config user.name "$GIT_USER"
          git config user.email "${GIT_USER_ID}+${GIT_USER}@users.noreply.github.com"
          git add ./src/ACadSharp/ACadSharp.csproj
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "#PR${{github.event.pull_request.number}} ${{steps.update.outputs.newVersion}}"
          git pull --rebase origin master
          git push origin HEAD:master
